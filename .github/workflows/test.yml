name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated test runtime
        run: docker build -f tests/Dockerfile -t snellctl-test .
      - name: Syntax and shell lint
        run: docker run --rm snellctl-test bash -c 'bash -n snell.sh && shellcheck snell.sh'
      - name: Unit and transaction tests
        run: docker run --rm snellctl-test
